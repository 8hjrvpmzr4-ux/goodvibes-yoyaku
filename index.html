<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOOD VIBES WEB予約</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#141414;--sub:#6e6e6a;--line:#e3e3de;--acc:#141414;--ok:#0f9d6b;--dis:#c9c9c4;--err:#b42318}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;padding-bottom:96px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--acc);color:#fff;text-align:center;padding:14px 16px}
header b{letter-spacing:.25em;font-size:17px}
header small{display:block;font-size:11px;letter-spacing:.12em;opacity:.7}
.steps{display:flex;max-width:560px;margin:0 auto;padding:14px 10px 4px}
.st{flex:1;text-align:center;font-size:10px;color:var(--sub)}
.st i{display:flex;width:24px;height:24px;margin:0 auto 3px;border-radius:50%;background:#e3e3de;color:#8a8a85;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700}
.st.on i{background:var(--acc);color:#fff}.st.on{color:var(--ink);font-weight:700}
.st.done i{background:var(--ok);color:#fff}
main{max-width:560px;margin:0 auto;padding:6px 16px}
h2{font-size:17px;margin:14px 0 10px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;margin-top:8px}
.sum p{display:flex;gap:10px}.sum p span{color:var(--sub);flex:0 0 64px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.opt b{display:block;font-weight:600}
.opt small{color:var(--sub);font-size:12px}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tag{display:inline-block;font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin:0 4px 4px 0;color:var(--sub)}
.tag.w{border-color:#d9a400;color:#8a6a00}
.seg{display:flex;background:#e8e8e3;border-radius:10px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 4px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.add{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.add input{width:20px;height:20px;margin-top:2px;flex:0 0 auto;accent-color:var(--acc)}
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calnav button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:40px;height:36px;font-size:18px}
.calnav button:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
.cal .h.su{color:#c0392b}.cal .h.sa{color:#2563eb}
.d{border:0;border-radius:8px;background:#ecece8;color:#a8a8a3;text-align:center;padding:6px 0;font-size:14px;min-height:52px}
.d i{display:block;font-style:normal;font-size:13px}
.d.ok{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.d.ok i{color:var(--ok);font-weight:700}
.d.sel{background:var(--acc);color:#fff}.d.sel i{color:#fff}
.legend{font-size:12px;color:var(--sub);margin-top:10px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 0;font-size:15px;font-weight:600}
.slots button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
label.f{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.req{background:var(--err);color:#fff;font-size:10px;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
input.t,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;background:var(--card);font-family:inherit}
textarea{min-height:90px}
.err{color:var(--err);font-size:13px;margin-top:8px}
.note{font-size:12px;color:var(--sub);margin-top:12px}
.conf{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.conf p{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.conf p:last-child{border:0}
.conf p span{flex:0 0 80px;color:var(--sub)}
.done{text-align:center;padding:30px 0}
.done .ck{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:34px;line-height:64px;margin:0 auto 14px}
.load{text-align:center;color:var(--sub);padding:30px 0;font-size:14px}
.demo{background:#fff4d6;color:#7a5b00;font-size:12px;text-align:center;padding:6px 10px}
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(245,245,242,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
footer .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
footer button{flex:1;border-radius:12px;padding:13px 0;font-size:15px;font-weight:700;border:1px solid var(--line);background:var(--card)}
footer button.pri{background:var(--acc);color:#fff;border-color:var(--acc);flex:2}
footer button:disabled{background:var(--dis);border-color:var(--dis);color:#fff}
</style>
</head>
<body>
<div id="demo"></div>
<header><b>GOOD VIBES</b><small>WEB予約</small></header>
<div class="steps" id="steps"></div>
<main id="main"><div class="load">読み込み中…</div></main>
<footer id="foot" hidden><div class="in" id="footIn"></div></footer>

<script>
/* ===== 設定（手順書に沿って入力） ===== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw8noyxfEWbsTKzq3rv9WU9wPEm6vBC_4P41NckQPZYnh-ERnJTgrcWZpqoyvr_-9Ookg/exec';  // GASのウェブアプリURL（https://script.google.com/macros/s/.../exec）
const LIFF_ID = '';  // LINE DevelopersのLIFF ID
/* ===================================== */

const DEMO = !GAS_URL;
const STEPS = ['店舗', 'メニュー', '日付', '時間', 'お客様情報', '確認'];
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const STORE_SUB = { '長崎店': '長崎市銅座町', '諫早店': '諫早市多良見町' };
const S = { step: 0, store: '', visit: '新規', menu: null, addons: [], date: '', start: '', end: '', name: '', tel: '', note: '', userId: '', displayName: '' };
let DATA = { stores: [], menus: [] };
let cal = { ym: '', today: '', last: '' };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => ('0' + n).slice(-2);
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const jpDate = ds => { const [y, m, d] = ds.split('-').map(Number); return `${y}年${m}月${d}日(${WD[new Date(y, m - 1, d).getDay()]})`; };
const addonList = () => DATA.menus.filter(x => S.addons.includes(x.id));
const totalDur = () => (S.menu ? S.menu.dur : 0) + addonList().reduce((a, x) => a + x.dur, 0);

/* ----- 通信 ----- */
async function api(params) {
  if (DEMO) return mock(params);
  const r = await fetch(GAS_URL + '?' + new URLSearchParams(params));
  return r.json();
}
async function post(data) {
  if (DEMO) return { ok: true, id: 'DEMO' };
  const r = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(data) });
  return r.json();
}
function loadScript(src) {
  return new Promise((ok, ng) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ng; document.head.appendChild(s); });
}

/* ----- 起動 ----- */
async function boot() {
  if (DEMO) $('#demo').innerHTML = '<div class="demo">デモ表示中（GAS_URL未設定のため予約は保存されません）</div>';
  try {
    if (LIFF_ID) {
      await loadScript('https://static.line-scdn.net/liff/edge/2/sdk.js');
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      try { const p = await liff.getProfile(); S.userId = p.userId; S.displayName = p.displayName; } catch (e) {}
    }
    const r = await api({ action: 'init' });
    if (!r.ok) throw new Error(r.error);
    DATA = r;
    render();
  } catch (e) {
    $('#main').innerHTML = `<div class="load">読み込みに失敗しました。<br>時間をおいて再度お試しください。<br><small>${esc(e.message || e)}</small></div>`;
  }
}

/* ----- 画面描画 ----- */
function render() {
  $('#steps').innerHTML = STEPS.map((t, i) => `<div class="st ${i < S.step ? 'done' : i === S.step ? 'on' : ''}"><i>${i < S.step ? '✓' : i + 1}</i>${t}</div>`).join('');
  if (S.step >= 6) $('#steps').innerHTML = '';
  const v = [renderStore, renderMenu, renderDate, renderTime, renderInfo, renderConfirm, renderDone][S.step]();
  $('#main').innerHTML = (S.step > 0 && S.step < 5 ? summary() : '') + v.html;
  $('#foot').hidden = !v.foot;
  $('#footIn').innerHTML = v.foot || '';
  if (v.after) v.after();
  window.scrollTo(0, 0);
}

function summary() {
  const rows = [];
  if (S.store) rows.push(['店舗', S.store]);
  if (S.menu && S.step > 1) rows.push(['メニュー', S.menu.name + (addonList().length ? ' ＋ ' + addonList().map(x => x.name).join('、') : '')]);
  if (S.date && S.step > 2) rows.push(['日付', jpDate(S.date)]);
  if (S.start && S.step > 3) rows.push(['時間', S.start + '〜' + S.end]);
  return rows.length ? '<div class="sum">' + rows.map(r => `<p><span>${r[0]}</span>${esc(r[1])}</p>`).join('') + '</div>' : '';
}

const backBtn = '<button onclick="go(S.step-1)">戻る</button>';

function renderStore() {
  return {
    html: '<h2>店舗を選択</h2>' + DATA.stores.map(s =>
      `<button class="opt ${S.store === s ? 'sel' : ''}" onclick="pickStore('${s}')"><b>${s}</b><small>${STORE_SUB[s] || ''}</small></button>`).join('')
  };
}

function renderMenu() {
  const fit = x => (x.stores === '両店舗' || x.stores.includes(S.store)) && (x.type === '全員' || x.type === S.visit);
  const list = DATA.menus.filter(x => !x.addon && fit(x));
  const adds = DATA.menus.filter(x => x.addon && fit(x));
  let h = '<h2>メニューを選択</h2>';
  h += `<div class="seg"><button class="${S.visit === '新規' ? 'on' : ''}" onclick="setVisit('新規')">初めての方</button><button class="${S.visit === '再来' ? 'on' : ''}" onclick="setVisit('再来')">2回目以降の方</button></div>`;
  h += list.map(x => `<button class="opt ${S.menu && S.menu.id === x.id ? 'sel' : ''}" onclick="pickMenu('${x.id}')">
      ${x.type !== '全員' ? `<span class="tag">${x.type === '新規' ? '初めての方限定' : '2回目以降の方'}</span>` : ''}${x.weekdayOnly ? '<span class="tag w">平日のみ</span>' : ''}
      <b>${esc(x.name)}</b><small>所要時間 約${x.dur}分</small></button>`).join('') || '<p class="note">選択できるメニューがありません。</p>';
  if (adds.length) {
    h += '<h2>追加メニュー（任意）</h2>' + adds.map(x => `<label class="add"><input type="checkbox" ${S.addons.includes(x.id) ? 'checked' : ''} onchange="toggleAdd('${x.id}',this.checked)"><span>${esc(x.name)}<br><small>所要時間 約${x.dur}分</small></span></label>`).join('');
  }
  return { html: h, foot: backBtn + `<button class="pri" ${S.menu ? '' : 'disabled'} onclick="go(2)">日付を選ぶ</button>` };
}

function renderDate() {
  if (!cal.ym) { const t = new Date(); cal.ym = t.getFullYear() + '-' + pad(t.getMonth() + 1); }
  const [y, m] = cal.ym.split('-').map(Number);
  const h = `<h2>日付を選択</h2>
    <div class="calnav"><button id="prevM" onclick="moveMonth(-1)">‹</button><b>${y}年${m}月</b><button id="nextM" onclick="moveMonth(1)">›</button></div>
    <div class="cal" id="cal"><div class="load" style="grid-column:1/-1">空き状況を確認中…</div></div>
    <p class="legend">○ 予約可　× 満席　休 休業日　－ 対象外の日</p>`;
  return { html: h, foot: backBtn, after: loadMonth };
}

async function loadMonth() {
  const ym = cal.ym;
  const r = await api({ action: 'month', store: S.store, ym, menu: S.menu.id, addons: S.addons.join(',') });
  if (ym !== cal.ym || S.step !== 2) return;
  if (!r.ok) { $('#cal').innerHTML = `<p class="err" style="grid-column:1/-1">${esc(r.error)}</p>`; return; }
  cal.today = r.today; cal.last = r.last;
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1).getDay();
  let g = WD.map((w, i) => `<div class="h ${i === 0 ? 'su' : i === 6 ? 'sa' : ''}">${w}</div>`).join('');
  for (let i = 0; i < first; i++) g += '<div></div>';
  Object.keys(r.days).sort().forEach(ds => {
    const d = Number(ds.slice(8)); const st = r.days[ds];
    if (st === 'open') g += `<button class="d ok ${S.date === ds ? 'sel' : ''}" onclick="pickDate('${ds}')">${d}<i>○</i></button>`;
    else g += `<div class="d">${d}<i>${{ full: '×', off: '休', na: '－' }[st] || ''}</i></div>`;
  });
  $('#cal').innerHTML = g;
  const thisYm = cal.today.slice(0, 7), lastYm = cal.last.slice(0, 7);
  $('#prevM').disabled = ym <= thisYm;
  $('#nextM').disabled = ym >= lastYm;
}

function renderTime() {
  return {
    html: `<h2>時間を選択</h2><p class="note" style="margin:-4px 0 10px">${jpDate(S.date)}　所要時間 約${totalDur()}分</p><div class="slots" id="slots"><div class="load" style="grid-column:1/-1">空き時間を確認中…</div></div>`,
    foot: backBtn, after: loadSlots
  };
}

async function loadSlots() {
  const r = await api({ action: 'slots', store: S.store, date: S.date, menu: S.menu.id, addons: S.addons.join(',') });
  if (S.step !== 3) return;
  if (!r.ok) { $('#slots').innerHTML = `<p class="err" style="grid-column:1/-1">${esc(r.error)}</p>`; return; }
  $('#slots').innerHTML = r.slots.length
    ? r.slots.map(t => `<button class="${S.start === t ? 'sel' : ''}" onclick="pickTime('${t}')">${t}</button>`).join('')
    : '<p class="note" style="grid-column:1/-1">この日は空きがありません。別の日をお選びください。</p>';
}

function renderInfo() {
  const h = `<h2>お客様情報の入力</h2>
    <label class="f"><span class="req">必須</span>お名前（フルネーム）</label>
    <input class="t" id="fName" value="${esc(S.name)}" placeholder="長崎 太郎" autocomplete="name">
    <label class="f"><span class="req">必須</span>電話番号（ハイフンなし）</label>
    <input class="t" id="fTel" value="${esc(S.tel)}" placeholder="09012345678" inputmode="tel" autocomplete="tel">
    <label class="f">ご要望・ご相談</label>
    <textarea id="fNote" placeholder="気になる部位やご質問があればご記入ください">${esc(S.note)}</textarea>
    <p class="err" id="fErr"></p>`;
  return { html: h, foot: backBtn + '<button class="pri" onclick="checkInfo()">確認へ進む</button>' };
}

function renderConfirm() {
  const add = addonList().map(x => x.name).join('、');
  const h = `<h2>ご予約内容の確認</h2><div class="conf">
    <p><span>店舗</span>${esc(S.store)}</p>
    <p><span>日時</span>${jpDate(S.date)}<br>${S.start}〜${S.end}</p>
    <p><span>メニュー</span>${esc(S.menu.name)}</p>
    ${add ? `<p><span>追加</span>${esc(add)}</p>` : ''}
    <p><span>お名前</span>${esc(S.name)} 様</p>
    <p><span>電話番号</span>${esc(S.tel)}</p>
    ${S.note ? `<p><span>ご要望</span>${esc(S.note)}</p>` : ''}
  </div><p class="err" id="cErr"></p>
  <p class="note">ご予約の変更・キャンセルは、LINEのトークまたはお電話でご連絡ください。</p>`;
  return { html: h, foot: backBtn + '<button class="pri" id="sendBtn" onclick="submit()">予約を確定する</button>' };
}

function renderDone() {
  return {
    html: `<div class="done"><div class="ck">✓</div><h2>ご予約が完了しました</h2>
      <p>${esc(S.store)}<br>${jpDate(S.date)} ${S.start}〜${S.end}</p>
      <p class="note">ご来店を心よりお待ちしております。<br>変更・キャンセルはLINEのトークでご連絡ください。</p></div>`,
    foot: (window.liff && liff.isInClient && liff.isInClient()) ? '<button class="pri" onclick="liff.closeWindow()">閉じる</button>' : ''
  };
}

/* ----- 操作 ----- */
function go(n) { S.step = n; render(); }
function pickStore(s) { if (S.store !== s) { S.store = s; S.menu = null; S.addons = []; S.date = ''; S.start = ''; } go(1); }
function setVisit(v) { if (S.visit !== v) { S.visit = v; S.menu = null; S.addons = []; } render(); }
function pickMenu(id) { S.menu = DATA.menus.find(x => x.id === id); S.date = ''; S.start = ''; render(); }
function toggleAdd(id, on) { S.addons = on ? [...new Set([...S.addons, id])] : S.addons.filter(x => x !== id); S.date = ''; S.start = ''; }
function moveMonth(k) { let [y, m] = cal.ym.split('-').map(Number); m += k; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } cal.ym = y + '-' + pad(m); render(); }
function pickDate(ds) { S.date = ds; S.start = ''; go(3); }
function pickTime(t) {
  S.start = t;
  const [h, m] = t.split(':').map(Number); const e = h * 60 + m + totalDur();
  S.end = pad(Math.floor(e / 60)) + ':' + pad(e % 60);
  go(4);
}
function checkInfo() {
  S.name = $('#fName').value.trim();
  S.tel = $('#fTel').value.replace(/[^0-9０-９]/g, '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  S.note = $('#fNote').value.trim();
  if (!S.name) return $('#fErr').textContent = 'お名前を入力してください';
  if (!/^0\d{9,10}$/.test(S.tel)) return $('#fErr').textContent = '電話番号を正しく入力してください（例：09012345678）';
  go(5);
}
async function submit() {
  const btn = $('#sendBtn'); btn.disabled = true; btn.textContent = '送信中…';
  try {
    const r = await post({ store: S.store, visit: S.visit, menu: S.menu.id, addons: S.addons.join(','), date: S.date, start: S.start, name: S.name, tel: S.tel, note: S.note, userId: S.userId, displayName: S.displayName });
    if (!r.ok) {
      if (r.code === 'TAKEN') { alert(r.error); S.start = ''; go(3); return; }
      throw new Error(r.error);
    }
    await sendLineMessage();
    go(6);
  } catch (e) {
    $('#cErr').textContent = '送信できませんでした：' + (e.message || e);
    btn.disabled = false; btn.textContent = '予約を確定する';
  }
}
async function sendLineMessage() {
  if (!window.liff || !liff.isInClient || !liff.isInClient()) return;
  const add = addonList().map(x => x.name).join('、');
  const lines = ['店舗：' + S.store, '日時：' + jpDate(S.date) + ' ' + S.start + '〜' + S.end, 'メニュー：' + S.menu.name];
  if (add) lines.push('追加：' + add);
  lines.push('お名前：' + S.name + ' 様');
  const text = '【LINE予約】予約しました\n\n' + lines.join('\n');
  try { await liff.sendMessages([{ type: 'text', text }]); } catch (e) {}
}

/* ----- デモ用（GAS_URL未設定時のみ使用） ----- */
const DEMO_MENUS = [
  [1, '新規', '【新生活応援キャンペーン♪】著名人御用達！眉ワックス&ヒゲ脱毛¥4,000'],
  [2, '新規', '【STAFFしゅん担当】ご新規様初回髭脱毛¥5500→¥1000'],
  [3, '全員', '【STAFFしゅんび限定眉ワックスクーポン】¥2,000'],

function mock(p) {
  if (p.action === 'init') return { ok: true, stores: ['長崎店', '諫早店'], menus: DEMO_MENUS };
  const now = new Date(), today = ymd(now), last = ymd(new Date(now.getTime() + 60 * 86400000));
  const main = DEMO_MENUS.find(x => x.id === p.menu);
  const adds = DEMO_MENUS.filter(x => x.addon && String(p.addons || '').split(',').includes(x.id));
  const dur = main.dur + adds.reduce((a, x) => a + x.dur, 0);
  const wo = main.weekdayOnly || adds.some(x => x.weekdayOnly);
  const day = ds => {
    if (ds < today || ds > last) return { status: 'out', slots: [] };
    const [y, m, d] = ds.split('-').map(Number); const w = new Date(y, m - 1, d).getDay(); const we = w === 0 || w === 6;
    if (wo && we) return { status: 'na', slots: [] };
    const close = we ? 18 * 60 : 20 * 60; const slots = [];
    for (let s = 600; s + dur <= close; s += 30) {
      if (ds === today && s < now.getHours() * 60 + now.getMinutes() + 60) continue;
      slots.push(pad(Math.floor(s / 60)) + ':' + pad(s % 60));
    }
    return { status: slots.length ? 'open' : 'full', slots };
  };
  if (p.action === 'month') {
    const [y, m] = p.ym.split('-').map(Number); const n = new Date(y, m, 0).getDate(); const days = {};
    for (let d = 1; d <= n; d++) { const ds = `${y}-${pad(m)}-${pad(d)}`; days[ds] = day(ds).status; }
    return { ok: true, days, today, last };
  }
  if (p.action === 'slots') return { ok: true, ...day(p.date) };
}
